name: Build reviewable release artifacts
on: workflow_dispatch
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: CLIPP_USE_CUDA=0 python -m build
      - run: sha256sum dist/* > dist/SHA256SUMS
      - run: python -m pip freeze > dist/build-environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clipp15-review-artifacts
          path: dist/
