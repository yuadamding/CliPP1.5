name: Smoke-test release artifacts
on: workflow_dispatch
permissions:
  contents: read
env:
  CLIPP_USE_CUDA: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Execute the exact wheel
        working-directory: /tmp
        run: |
          clipp doctor > "$RUNNER_TEMP/doctor.json"
          clipp fit "$GITHUB_WORKSPACE/sample/sample.snv.txt" "$GITHUB_WORKSPACE/sample/sample.cna.txt" "$GITHUB_WORKSPACE/sample/sample.purity.txt" --device cpu --output "$RUNNER_TEMP/wheel-example"
          clipp verify "$RUNNER_TEMP/wheel-example"
      - name: Execute the exact sdist
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install dist/*.tar.gz
          cd /tmp
          "$RUNNER_TEMP/sdist-env/bin/clipp" fit "$GITHUB_WORKSPACE/sample/sample.snv.txt" "$GITHUB_WORKSPACE/sample/sample.cna.txt" "$GITHUB_WORKSPACE/sample/sample.purity.txt" --device cpu --output "$RUNNER_TEMP/sdist-example"
          "$RUNNER_TEMP/sdist-env/bin/clipp" verify "$RUNNER_TEMP/sdist-example"
      - name: Seal artifacts after both examples pass
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          python -m pip freeze > dist/test-environment.txt
          git rev-parse HEAD > dist/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clipp15-smoke-tested-artifacts
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipp15-artifact-evidence
          path: |
            ${{ runner.temp }}/doctor.json
            ${{ runner.temp }}/wheel-example/
            ${{ runner.temp }}/sdist-example/
