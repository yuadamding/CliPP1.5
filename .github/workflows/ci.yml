name: CPU numerical and artifact checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
env:
  CLIPP_USE_CUDA: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and check tools
        run: python -m pip install build ruff 'setuptools>=77' wheel
      - name: Check source
        run: |
          python -m ruff check src/clipp setup.py
          python -m compileall -q src/clipp setup.py
          git diff --check
      - name: Build wheel and source distribution
        run: |
          python -m build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Install the exact wheel and freeze its runtime stack
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          root.joinpath("runtime-constraints.txt").write_text(
              "".join(f"{name}=={version(name)}\n" for name in ("numpy", "scipy", "pandas"))
          )
          PY
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          clipp doctor > doctor.json
          clipp validate "$GITHUB_WORKSPACE/sample/sample.snv.txt" "$GITHUB_WORKSPACE/sample/sample.cna.txt" "$GITHUB_WORKSPACE/sample/sample.purity.txt"
          clipp fit "$GITHUB_WORKSPACE/sample/sample.snv.txt" "$GITHUB_WORKSPACE/sample/sample.cna.txt" "$GITHUB_WORKSPACE/sample/sample.purity.txt" --device cpu --max-clusters 10 --output wheel-example
          clipp verify wheel-example > wheel-verification.json
          python - <<'PY'
          from pathlib import Path
          root = Path("small-input")
          root.mkdir()
          root.joinpath("snv.txt").write_text(
              "chromosome_index\tposition\talt_count\tref_count\n"
              "1\t10\t2\t18\n1\t20\t3\t17\n1\t30\t7\t13\n1\t40\t8\t12\n"
          )
          root.joinpath("cna.txt").write_text(
              "chromosome_index\tstart_position\tend_position\tmajor_cn\tminor_cn\ttotal_cn\n"
              "1\t1\t25\t1\t1\t2\n1\t26\t100\t3\t1\t4\n"
          )
          root.joinpath("purity.txt").write_text("1\n")
          PY
          clipp fit small-input/snv.txt small-input/cna.txt small-input/purity.txt --device cpu --max-clusters 2 --output wheel-small
          clipp verify wheel-small > wheel-small-verification.json
          python - <<'PYCODE'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy.special import logsumexp
          from scipy.stats import binom
          from clipp import load_result
          for directory in ("wheel-example", "wheel-small"):
              paths = {p.relative_to(directory).as_posix() for p in Path(directory).rglob("*")}
              assert paths == {"final_result", "final_result/mutations.tsv", "final_result/clusters.tsv"}
              result = load_result(directory)
              assert "multiplicity_probability" in result.mutations
          observations = pd.read_csv("small-input/snv.txt", sep="\t")
          result = load_result("wheel-small")
          for row in result.mutations.itertuples():
              observed = observations.iloc[row.original_row - 1]
              cluster = result.clusters.iloc[row.cluster_index]
              total = 2 if int(row.position) <= 25 else 4
              support = np.arange(1, row.major_cn + 1)
              denominator = 2 * (1 - cluster.purity) + cluster.purity * total
              logs = binom.logpmf(observed.alt_count, observed.alt_count + observed.ref_count,
                                 cluster.cellular_prevalence * support / denominator)
              expected = np.exp(logs - logsumexp(logs)).max()
              np.testing.assert_allclose(row.multiplicity_probability, expected, atol=2e-12, rtol=2e-12)
          PYCODE
      - name: Install and test the exact source distribution
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv sdist-env
          sdist-env/bin/python -m pip install -c runtime-constraints.txt "$GITHUB_WORKSPACE"/dist/*.tar.gz
          sdist-env/bin/python -m pip check
          sdist-env/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          expected = Path("runtime-constraints.txt").read_text()
          actual = "".join(f"{name}=={version(name)}\n" for name in ("numpy", "scipy", "pandas"))
          if actual != expected:
              raise RuntimeError("The sdist numerical stack differs from the tested wheel")
          PY
          sdist-env/bin/clipp doctor > sdist-doctor.json
          sdist-env/bin/clipp fit "$GITHUB_WORKSPACE/sample/sample.snv.txt" "$GITHUB_WORKSPACE/sample/sample.cna.txt" "$GITHUB_WORKSPACE/sample/sample.purity.txt" --device cpu --max-clusters 10 --output sdist-example
          sdist-env/bin/clipp verify sdist-example > sdist-verification.json
          cmp wheel-example/final_result/clusters.tsv sdist-example/final_result/clusters.tsv
          cmp wheel-example/final_result/mutations.tsv sdist-example/final_result/mutations.tsv
          sdist-env/bin/clipp fit small-input/snv.txt small-input/cna.txt small-input/purity.txt --device cpu --max-clusters 2 --output sdist-small
          sdist-env/bin/clipp verify sdist-small > sdist-small-verification.json
          cmp wheel-small/final_result/clusters.tsv sdist-small/final_result/clusters.tsv
          cmp wheel-small/final_result/mutations.tsv sdist-small/final_result/mutations.tsv
      - name: Seal artifacts only after every check passes
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
          python -m pip freeze > dist/test-environment.txt
          cp "$RUNNER_TEMP/runtime-constraints.txt" dist/runtime-constraints.txt
          git rev-parse HEAD > dist/source-commit.txt
      - name: Retain resolved environments
        if: always()
        run: |
          python -m pip freeze > "$RUNNER_TEMP/dependencies.txt"
          if test -x "$RUNNER_TEMP/sdist-env/bin/python"; then
            "$RUNNER_TEMP/sdist-env/bin/python" -m pip freeze > "$RUNNER_TEMP/sdist-dependencies.txt"
          fi
      - name: Upload qualified CPU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipp15-cpu-artifacts-${{ matrix.python }}
          path: dist/
      - name: Retain evidence including failed checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipp15-cpu-evidence-${{ matrix.python }}
          path: |
            dist/
            ${{ runner.temp }}/*doctor.json
            ${{ runner.temp }}/*dependencies.txt
            ${{ runner.temp }}/runtime-constraints.txt
            ${{ runner.temp }}/*verification.json
            ${{ runner.temp }}/*build.log
            ${{ runner.temp }}/wheel-example/
            ${{ runner.temp }}/sdist-example/
            ${{ runner.temp }}/wheel-small/
            ${{ runner.temp }}/sdist-small/
