name: CPU artifact checks
on: [push, pull_request]
permissions:
  contents: read
env:
  CLIPP_USE_CUDA: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build ruff
      - run: python -m ruff check src/clipp setup.py
      - run: python -m compileall -q src/clipp setup.py
      - run: git diff --check
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Installed wheel example (no R or NVIDIA installation)
        working-directory: /tmp
        run: |
          clipp doctor > "$RUNNER_TEMP/doctor.json"
          clipp validate "$GITHUB_WORKSPACE/sample/sample.snv.txt" "$GITHUB_WORKSPACE/sample/sample.cna.txt" "$GITHUB_WORKSPACE/sample/sample.purity.txt"
          clipp fit "$GITHUB_WORKSPACE/sample/sample.snv.txt" "$GITHUB_WORKSPACE/sample/sample.cna.txt" "$GITHUB_WORKSPACE/sample/sample.purity.txt" --device cpu --max-clusters 10 --output "$RUNNER_TEMP/wheel-example"
          clipp verify "$RUNNER_TEMP/wheel-example"
      - name: Fresh source-distribution install and example
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install dist/*.tar.gz
          cd /tmp
          "$RUNNER_TEMP/sdist-env/bin/clipp" fit "$GITHUB_WORKSPACE/sample/sample.snv.txt" "$GITHUB_WORKSPACE/sample/sample.cna.txt" "$GITHUB_WORKSPACE/sample/sample.purity.txt" --device cpu --max-clusters 10 --output "$RUNNER_TEMP/sdist-example"
          "$RUNNER_TEMP/sdist-env/bin/clipp" verify "$RUNNER_TEMP/sdist-example"
      - name: Retain resolved stack
        if: always()
        run: python -m pip freeze > "$RUNNER_TEMP/dependencies.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-example-${{ matrix.python }}
          path: |
            dist/
            ${{ runner.temp }}/doctor.json
            ${{ runner.temp }}/dependencies.txt
            ${{ runner.temp }}/wheel-example/
            ${{ runner.temp }}/sdist-example/
