[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipp15"
version = "1.5.1"
description = "Single-sample fixed-chain cancer mutation clustering with latent multiplicity"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "CliPP contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.13", "build>=1.2"]

[project.scripts]
clipp = "clipp.cli:main"

[project.urls]
Repository = "https://github.com/yuadamding/CliPP1.5"
Issues = "https://github.com/yuadamding/CliPP1.5/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clipp*"]

[tool.setuptools.package-data]
clipp = ["resources/*.R", "_build_info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires an explicitly allocated CUDA device (not CPU qualification)"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
