[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipp15"
version = "1.6.0"
description = "Single-sample fixed-chain cancer mutation clustering with latent multiplicity"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "CliPP contributors"}]
dependencies = ["numpy>=2.2.6", "scipy>=1.18,<1.19", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["ruff>=0.13", "build>=1.2"]

[project.scripts]
clipp = "clipp.cli:main"

[project.urls]
Repository = "https://github.com/yuadamding/CliPP1.5"
Issues = "https://github.com/yuadamding/CliPP1.5/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clipp*"]

[tool.setuptools.package-data]
clipp = ["_build_info.json"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
