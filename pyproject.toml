[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipp1d"
version = "0.5.1.dev0"
description = "Single-sample observed-count fusion on a complete graph with CUDA"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.9"]

[project.optional-dependencies]
simulation = ["pandas>=1.5", "tqdm>=4.64"]
test = ["pytest>=8", "ruff>=0.12", "osqp>=1.0", "pandas>=1.5", "tqdm>=4.64"]

[project.scripts]
clipp1d = "clipp1d.cli:main"
clipp1d-simulate = "clipp1d.simulation.generate_clippsim4k:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
